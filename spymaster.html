<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Codenames — Spymaster</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c0392b;
    --red-light: #e74c3c;
    --blue: #1a5276;
    --blue-light: #2980b9;
    --neutral: #555;
    --assassin: #1a1a1a;
    --gold: #f39c12;
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #888;
    --team-color: #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* TEAM SELECT SCREEN */
  #team-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; z-index: 200; padding: 24px;
  }
  #team-screen.hidden { display: none; }
  .ts-logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 32px; letter-spacing: 6px;
    color: var(--gold);
  }
  .ts-sub { color: var(--text-dim); font-size: 12px; letter-spacing: 2px; }
  .ts-room {
    font-family: 'Bebas Neue', cursive;
    font-size: 48px; letter-spacing: 10px;
    color: var(--text);
  }
  .ts-label { color: var(--text-dim); font-size: 13px; margin-bottom: -8px; }
  .team-btn {
    width: 100%; max-width: 320px;
    padding: 20px;
    border: none; border-radius: 8px;
    font-family: 'Bebas Neue', cursive;
    font-size: 28px; letter-spacing: 4px;
    cursor: pointer; transition: opacity 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .team-btn:hover { opacity: 0.85; }
  .team-btn.red { background: var(--red-light); color: white; }
  .team-btn.blue { background: var(--blue-light); color: white; }

  /* HEADER */
  header {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 2px solid var(--team-color);
    display: flex; align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .h-logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 20px; letter-spacing: 4px;
    color: var(--gold);
  }
  .h-team {
    font-family: 'Bebas Neue', cursive;
    font-size: 18px; letter-spacing: 3px;
    color: var(--team-color);
  }
  .h-room {
    font-family: 'Bebas Neue', cursive;
    font-size: 14px; letter-spacing: 3px;
    color: var(--text-dim);
  }

  /* SCORE STRIP */
  .scorestrip {
    display: flex; align-items: center;
    padding: 8px 16px; gap: 12px;
    background: #111;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ss-item {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Bebas Neue', cursive;
    font-size: 16px; letter-spacing: 2px;
  }
  .ss-dot { width: 10px; height: 10px; border-radius: 50%; }
  .ss-dot.red { background: var(--red-light); }
  .ss-dot.blue { background: var(--blue-light); }
  .ss-spacer { flex: 1; }
  .ss-turn {
    font-size: 12px; letter-spacing: 2px;
    color: var(--text-dim);
  }
  .ss-turn span { color: var(--gold); }

  /* CLUE INPUT */
  .clue-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .clue-input {
    flex: 1;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Bebas Neue', cursive;
    font-size: 22px;
    letter-spacing: 3px;
    padding: 10px 14px;
    outline: none;
    text-transform: uppercase;
  }
  .clue-input:focus { border-color: var(--team-color); }
  .clue-input::placeholder { color: var(--text-dim); font-size: 16px; letter-spacing: 2px; }
  .num-select {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 8px;
  }
  .num-btn {
    width: 40px; height: 40px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #111;
    color: var(--text);
    font-family: 'Bebas Neue', cursive;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .num-btn.selected { background: var(--team-color); border-color: var(--team-color); color: white; }
  .send-btn {
    width: 100%;
    padding: 14px;
    border: none; border-radius: 6px;
    background: var(--team-color);
    color: white;
    font-family: 'Bebas Neue', cursive;
    font-size: 20px; letter-spacing: 3px;
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* BOARD */
  .board-wrap { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .card {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 2px solid transparent;
  }
  .card-word {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(8px, 2.8vw, 14px);
    letter-spacing: 0.5px;
    text-align: center;
    padding: 2px;
    line-height: 1.1;
  }
  /* Spymaster sees colors */
  .card.red { background: var(--red); }
  .card.blue { background: var(--blue); }
  .card.neutral { background: #3a3a3a; }
  .card.assassin { background: #0a0a0a; border-color: #333; }
  .card.assassin .card-word { color: #444; }
  .card.revealed { opacity: 0.35; }
  .card.revealed::after {
    content: '✓';
    position: absolute;
    font-size: 20px;
    color: rgba(255,255,255,0.6);
  }
  .card.neutral .card-word { color: #aaa; }

  /* WIN OVERLAY */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 100; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .ov-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 52px; letter-spacing: 6px; text-align: center;
  }
  .ov-sub { color: var(--text-dim); font-size: 16px; text-align: center; }

  /* ACTION BAR */
  .action-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .action-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
  }
  .toggle-clue-btn {
    flex-shrink: 0;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--team-color);
    background: transparent;
    color: var(--team-color);
    font-family: 'Bebas Neue', cursive;
    font-size: 14px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .toggle-clue-btn.active {
    background: var(--team-color);
    color: white;
  }
  .toggle-clue-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .end-turn-btn-sm {
    flex-shrink: 0;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Bebas Neue', cursive;
    font-size: 14px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .end-turn-btn-sm:hover { border-color: var(--text); color: var(--text); }

  /* CLUE PANEL (collapsible) */
  .clue-panel {
    padding: 0 12px 12px;
    border-top: 1px solid var(--border);
  }
  .clue-panel.hidden { display: none; }

  /* CURRENT CLUE inline */
  #current-clue-display {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    overflow: hidden;
  }
  #current-clue-display.cc-empty {
    font-size: 11px; color: var(--text-dim); font-style: italic;
  }


    background: #1a1a1a;
    border: 1px solid var(--border);
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- TEAM SELECT -->
<div id="team-screen">
  <div class="ts-logo">CODENAMES</div>
  <div class="ts-sub">SPYMASTER CONTROLLER</div>
  <div class="ts-label">ROOM</div>
  <div class="ts-room" id="ts-room">----</div>
  <div class="ts-label" style="margin-top:8px;">เลือกทีมของคุณ</div>
  <button class="team-btn red" onclick="selectTeam('red')">🔴 RED SPYMASTER</button>
  <button class="team-btn blue" onclick="selectTeam('blue')">🔵 BLUE SPYMASTER</button>
</div>

<!-- HEADER -->
<header>
  <div class="h-logo">CODENAMES</div>
  <div class="h-team" id="h-team">—</div>
  <div class="h-room" id="h-room">----</div>
</header>

<!-- SCORE STRIP -->
<div class="scorestrip">
  <div class="ss-item">
    <div class="ss-dot red"></div>
    <span id="ss-red">0</span>
  </div>
  <div class="ss-item">
    <div class="ss-dot blue"></div>
    <span id="ss-blue">0</span>
  </div>
  <div class="ss-spacer"></div>
  <div class="ss-turn">TURN: <span id="ss-turn">—</span></div>
</div>

<!-- NOT YOUR TURN BANNER -->
<div class="not-turn-banner hidden" id="not-turn-banner">
  ⏳ รอตาของคุณ...
</div>

<!-- ACTION BAR: clue toggle + end turn + current clue -->
<div class="action-bar" id="action-bar">
  <div class="action-row">
    <button class="toggle-clue-btn" id="toggle-clue-btn" onclick="toggleCluePanel()">
      <span id="toggle-icon">✏️</span> <span id="toggle-label">ให้คำใบ้</span>
    </button>
    <div id="current-clue-display" class="cc-empty">ยังไม่มีคำใบ้</div>
    <button class="end-turn-btn-sm" onclick="endTurn()">⏩ จบตา</button>
  </div>

  <!-- COLLAPSIBLE CLUE PANEL -->
  <div class="clue-panel hidden" id="clue-panel">
    <div class="clue-row">
      <input class="clue-input" id="clue-word-input" type="text" maxlength="20" placeholder="คำใบ้...">
    </div>
    <div class="num-select" id="num-select"></div>
    <button class="send-btn" id="send-clue-btn" onclick="sendClue()" disabled>📤 ส่งคำใบ้</button>
  </div>
</div>

<!-- BOARD -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- WIN OVERLAY -->
<div class="overlay hidden" id="win-overlay">
  <div class="ov-title" id="ov-title">—</div>
  <div class="ov-sub" id="ov-sub">—</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDImomngpU2PIY4Su75Drb2u-xGhSoK5M",
  authDomain: "codenames-interactive.firebaseapp.com",
  databaseURL: "https://codenames-interactive-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "codenames-interactive",
  storageBucket: "codenames-interactive.firebasestorage.app",
  messagingSenderId: "827026535183",
  appId: "1:827026535183:web:cb17324409f02a3667447a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = null;
let myTeam = null;
let gameState = null;
let selectedNum = null;

const teamColors = { red: '#e74c3c', blue: '#2980b9' };

function getRoomFromURL() {
  return new URLSearchParams(window.location.search).get('room');
}

window.selectTeam = function(team) {
  myTeam = team;
  document.getElementById('team-screen').classList.add('hidden');
  document.getElementById('h-team').textContent = team.toUpperCase() + ' SPYMASTER';
  document.getElementById('h-team').style.color = teamColors[team];
  document.body.style.setProperty('--team-color', teamColors[team]);
  listenRoom();
}

// Build number selector
function buildNumSelect() {
  const wrap = document.getElementById('num-select');
  wrap.innerHTML = '';
  ['1','2','3','4','5','6','7','8','∞'].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = n;
    btn.onclick = () => {
      selectedNum = n === '∞' ? 0 : parseInt(n);
      wrap.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      checkSendReady();
    };
    wrap.appendChild(btn);
  });
}

function checkSendReady() {
  const word = document.getElementById('clue-word-input').value.trim();
  const ready = word.length > 0 && selectedNum !== null && gameState?.currentTurn === myTeam && gameState?.gameState === 'playing';
  document.getElementById('send-clue-btn').disabled = !ready;
}

window.sendClue = function() {
  const word = document.getElementById('clue-word-input').value.trim();
  if (!word || selectedNum === null) return;
  update(ref(db), {
    [`rooms/${roomId}/clue`]: { word, number: selectedNum }
  });
  document.getElementById('clue-word-input').value = '';
  selectedNum = null;
  document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
  checkSendReady();
}

window.endTurn = function() {
  if (!gameState || gameState.gameState !== 'playing') return;
  const nextTurn = gameState.currentTurn === 'red' ? 'blue' : 'red';
  update(ref(db), {
    [`rooms/${roomId}/currentTurn`]: nextTurn,
    [`rooms/${roomId}/clue`]: { word: '', number: 0 }
  });
}

function renderBoard(state) {
  const board = document.getElementById('board');
  board.innerHTML = '';
  state.cards.forEach((card) => {
    const el = document.createElement('div');
    el.className = `card ${card.role}` + (card.revealed ? ' revealed' : '');
    el.innerHTML = `<div class="card-word">${card.word}</div>`;
    board.appendChild(el);
  });
}

let cluePanelOpen = false;

window.toggleCluePanel = function() {
  cluePanelOpen = !cluePanelOpen;
  document.getElementById('clue-panel').classList.toggle('hidden', !cluePanelOpen);
  document.getElementById('toggle-clue-btn').classList.toggle('active', cluePanelOpen);
  document.getElementById('toggle-label').textContent = cluePanelOpen ? 'ซ่อน' : 'ให้คำใบ้';
  if (cluePanelOpen) document.getElementById('clue-word-input').focus();
}

function renderUI(state) {
  document.getElementById('ss-red').textContent = state.score.red;
  document.getElementById('ss-blue').textContent = state.score.blue;
  document.getElementById('ss-turn').textContent = state.currentTurn?.toUpperCase() || '—';

  const isMyTurn = state.currentTurn === myTeam;
  document.getElementById('not-turn-banner').classList.toggle('hidden', isMyTurn || state.gameState === 'ended');

  // Toggle btn enabled only on my turn
  const toggleBtn = document.getElementById('toggle-clue-btn');
  toggleBtn.disabled = !isMyTurn || state.gameState === 'ended';
  if (!isMyTurn && cluePanelOpen) {
    cluePanelOpen = false;
    document.getElementById('clue-panel').classList.add('hidden');
    toggleBtn.classList.remove('active');
    document.getElementById('toggle-label').textContent = 'ให้คำใบ้';
  }

  // Current clue
  const ccEl = document.getElementById('current-clue-display');
  if (state.clue && state.clue.word) {
    ccEl.className = '';
    ccEl.innerHTML = `
      <span class="cc-label">CLUE</span>
      <span class="cc-word">${state.clue.word.toUpperCase()}</span>
      <span class="cc-num">${state.clue.number || '∞'}</span>
    `;
  } else {
    ccEl.className = 'cc-empty';
    ccEl.textContent = 'ยังไม่มีคำใบ้';
  }

  checkSendReady();

  if (state.winner) {
    const colors = { red: '#e74c3c', blue: '#2980b9' };
    document.getElementById('ov-title').style.color = colors[state.winner];
    document.getElementById('ov-title').textContent = `${state.winner.toUpperCase()} WINS!`;
    document.getElementById('ov-sub').textContent = state.winReason === 'assassin' ? '💀 โดน Assassin!' : '🎉 เปิดการ์ดครบ!';
    document.getElementById('win-overlay').classList.remove('hidden');
  } else {
    document.getElementById('win-overlay').classList.add('hidden');
  }
}

function listenRoom() {
  onValue(ref(db, `rooms/${roomId}`), (snap) => {
    if (snap.exists()) {
      gameState = snap.val();
      renderBoard(gameState);
      renderUI(gameState);
    }
  });
}

// INIT
window.addEventListener('DOMContentLoaded', () => {
  roomId = getRoomFromURL();
  if (!roomId) {
    alert('ไม่พบ Room ID — กรุณาเปิดจากจอใหญ่');
    return;
  }
  document.getElementById('ts-room').textContent = roomId;
  document.getElementById('h-room').textContent = roomId;
  buildNumSelect();

  document.getElementById('clue-word-input').addEventListener('input', checkSendReady);
});
</script>
</body>
</html>
